<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QuillShip</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=Inter&display=swap" rel="stylesheet">

<style>
/* Body and fonts */
body {
    cursor: none !important;
}

body, input, textarea, button, a {
	cursor: none !important;
}

.entry {
	caret-color: transparent;
}

body {
    margin: 0;
    background: #f2e9dc;
    font-family: 'Cormorant Garamond', serif;
    overflow-x: hidden;
}

/* Frame containing notebook */
.frame {
    position: relative;
    width: 740px;
    margin: 60px auto;
}

/* Notebook */
.notebook {
    width: 700px;
    margin: 0 auto;
    padding: 0;
    background: transparent;
    box-sizing: border-box;
    position: relative;
    z-index: 1;
}

/* Titles */
.title {
    font-size: 32px;
    color: #5a4330;
    margin: 0 40px 10px;
}
.subtitle {
    font-size: 13px;
    color: #9c8570;
    margin: 0 40px 25px;
    font-style: italic;
    letter-spacing: 0.5px;
}

/* Writing area */
.entry {
    position: relative;
    z-index: 1;
    width: 100%;
    min-height: 300px;
    border: none;
    resize: none;
    font-size: 18px;
    background: url('https://i.imgur.com/vKA1DiL.png') repeat-y;
    background-size: 100% auto;
    background-position: top center;
    color: #2a1408;
    text-shadow:
        0.3px 0.3px 0 #1a0d05,
        0.5px 0.5px 0 rgba(0,0,0,0.2);
    font-family: 'Cormorant Garamond', serif;
    line-height: 1.6;
    padding: 60px 50px;
    box-sizing: border-box;
    outline: none;
    overflow: hidden;
}

/* Placeholder styling */
.entry::placeholder {
    color: rgba(70, 50, 30, 0.45);
    font-style: italic;
}

/* Parchment tint and grain */
.entry::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(90, 60, 30, 0.12);
    pointer-events: none;
    z-index: -1;
}
.entry::after {
    content: "";
    position: absolute;
    inset: 0;
    background: url('https://i.imgur.com/8Qf6YQK.png');
    opacity: 0.08;
    pointer-events: none;
    mix-blend-mode: multiply;
    z-index: -1;
}

/* Layout */
.notebook-with-sidebar {
    display: flex;
    max-width: 1000px;
    margin: 40px auto;
    position: relative;
}

/* Sidebar */
.sidebar {
    width: 200px;
    min-width: 200px;
    background: #f2e9dc;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-right: 2px solid #d1bfa3;
    overflow-y: auto;
    position: relative;
    z-index: 2;
}

#add-note {
    background: #d1bfa3;
    border: none;
    padding: 6px 10px;
    cursor: pointer;
    font-family: 'Cormorant Garamond', serif;
}

/* Sticky notes */
.sticky-note {
    position: absolute;
    min-width: 150px;
    min-height: 100px;
    max-width: 300px;
    resize: both;
    overflow: auto;
    z-index: 10;
    background: #f0d8c0;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    border-radius: 6px;
    font-family: 'Cormorant Garamond', serif;
}

/* Header for drag & buttons */
.note-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(200,150,100,0.8);
    padding: 2px 6px;
    cursor: move;
    font-size: 12px;
    font-weight: bold;
}

.note-title {
    flex: 1;
    margin-right: 6px;
    outline: none;
}

.note-body {
    padding: 6px;
    min-height: 60px;
    outline: none;
    color: rgba(0,0,0,0.45);
}

.delete-note, .minimize-note {
    background: none;
    border: none;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
}

/* Color selector */
.sticky-colors {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 4px;
}
.color-option {
    width: 20px;
    height: 20px;
    border-radius: 3px;
    cursor: pointer;
    border: 1px solid #555;
}

/* Sticky dock */
.sticky-dock {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 40px;
    background: rgba(200,180,150,0.9);
    display: flex;
    gap: 4px;
    padding: 2px;
    overflow-x: auto;
    z-index: 5000;
}

.dock-tab {
    background: #d1bfa3;
    padding: 2px 6px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
}

/* Colors */
.color-1 { background:#c8a16d; }
.color-2 { background:#e2cba9; }
.color-3 { background:#b5c99a; }
.color-4 { background:#a36e4c; }
.color-5 { background:#f0d8c0; }
.color-6 { background:#d9b48f; }
.color-7 { background:#8c6b4f; }
.color-8 { background:#d0a67b; }
.color-9 { background:#9a7d63; }
.color-10 { background:#c0b283; }
.color-11 { background:#b8a17a; }
.color-12 { background:#726255; }
.color-13 { background:#6e584f; }
.color-14 { background:#b3a18a; }
.color-15 { background:#d2c1a3; }

/* Music button */
#music-toggle {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 5000;
    background: #d1bfa3;
    border: none;
    padding: 6px 10px;
    font-family: 'Cormorant Garamond', serif;
    cursor: inherit;
}

/* Quill cursor */
#quill-cursor {
	position: fixed;
    width: 60px;
    height: 60px;
    pointer-events: none;
    z-index: 9999;
}
</style>
</head>

<body>

<img src="QuillCursor-fotor-bg-remover-20260329143216.png" id="quill-cursor">

<!-- MUSIC -->
<audio id="ship-music" loop>
    <source src="Docks - Granulation 2.mp3" type="audio/mpeg">
</audio>
<button id="music-toggle">🔊</button>

<div class="notebook-with-sidebar">
    <div class="sidebar">
        <button id="add-note">+ Add Note</button>
    </div>

    <div class="main-notebook">
        <div class="frame">
            <div class="notebook">
                <div class="title">QuillShip</div>
                <div class="subtitle">Flick your quill and calm your mind.</div>
                <textarea class="entry" placeholder="The ink won’t write itself...">
                </textarea>
            </div>
        </div>
    </div>
</div>

<!-- Sticky Dock -->
<div class="sticky-dock"></div>

<script>
// Journal save
const entry = document.querySelector(".entry");
entry.value = localStorage.getItem("journalEntry") || "";
entry.style.height = entry.scrollHeight + 'px';
entry.addEventListener("input", () => {
    entry.style.height = 'auto';
    entry.style.height = entry.scrollHeight + 'px';
    localStorage.setItem("journalEntry", entry.value);
});

// MUSIC (fade-in system)
const music = document.getElementById("ship-music");
const toggleBtn = document.getElementById("music-toggle");

let hasStarted = false;

function fadeIn(audio) {
    let vol = 0;
    audio.volume = 0;
    audio.muted = false;

    const interval = setInterval(() => {
        if (vol < 0.3) {
            vol += 0.01;
            audio.volume = vol;
        } else {
            clearInterval(interval);
        }
    }, 200);
}

// Start music on FIRST interaction
document.addEventListener("click", () => {
    if (!hasStarted) {
        music.play();
        fadeIn(music);
        hasStarted = true;
    }
});

// Toggle button
toggleBtn.addEventListener("click", () => {
    if (music.paused) {
        music.play();
        toggleBtn.textContent = "🔊";
    } else {
        music.pause();
        toggleBtn.textContent = "🔇";
    }
});

// Sticky notes full-featured
const addBtn = document.getElementById("add-note");
const dock = document.querySelector(".sticky-dock");
let notes = JSON.parse(localStorage.getItem("stickyNotes")) || [];

// Save notes
function saveNotes() {
    notes = [];
    document.querySelectorAll(".sticky-note").forEach(note => {
        notes.push({
            id: note.dataset.id,
            title: note.querySelector(".note-title").innerText,
            body: note.querySelector(".note-body").innerText,
            color: note.dataset.color,
            top: note.style.top,
            left: note.style.left,
            width: note.style.width,
            height: note.style.height,
            minimized: note.dataset.minimized === "true"
        });
    });
    localStorage.setItem("stickyNotes", JSON.stringify(notes));
}

// Create note
function createNote(data = {}) {
    const note = document.createElement("div");
    note.className = "sticky-note";
    note.dataset.id = data.id || Date.now().toString();
    note.dataset.color = data.color || "color-1";
    note.dataset.minimized = data.minimized || false;
    note.style.top = data.top || "50px";
    note.style.left = data.left || "220px";
    note.style.width = data.width || "200px";
    note.style.height = data.height || "150px";
    note.classList.add(note.dataset.color);

    // Header
    const header = document.createElement("div");
    header.className = "note-header";

    const title = document.createElement("div");
    title.className = "note-title";
    title.contentEditable = true;
    title.innerText = data.title || "New Note";

    const minimizeBtn = document.createElement("button");
    minimizeBtn.className = "minimize-note";
    minimizeBtn.innerText = "_";

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "delete-note";
    deleteBtn.innerText = "X";

    header.appendChild(title);
    header.appendChild(minimizeBtn);
    header.appendChild(deleteBtn);

    // Body
    const body = document.createElement("div");
    body.className = "note-body";
    body.contentEditable = true;
    body.innerText = data.body || "Don't waste your schedulae..."; // placeholder text
    body.style.color = data.body ? "#000" : "rgba(0,0,0,0.45)";

    // Placeholder behavior
    body.addEventListener("focus", () => {
        if (body.innerText === "Don't waste your schedulae...") {
            body.innerText = "";
            body.style.color = "#000";
        }
    });
    body.addEventListener("blur", () => {
        if (body.innerText.trim() === "") {
            body.innerText = "Don't waste your schedulae...";
            body.style.color = "rgba(0,0,0,0.45)";
        }
    });

    // Color selector
    const colorSelector = document.createElement("div");
    colorSelector.className = "sticky-colors";
    const colors = ['color-1','color-2','color-3','color-4','color-5',
                    'color-6','color-7','color-8','color-9','color-10',
                    'color-11','color-12','color-13','color-14','color-15'];
    colors.forEach(c => {
        const swatch = document.createElement("div");
        swatch.className = `color-option ${c}`;
        swatch.addEventListener("click", e => {
            note.classList.remove(note.dataset.color);
            note.classList.add(c);
            note.dataset.color = c;
            colorSelector.style.display = "none"; // hide after selection
            saveNotes();
            e.stopPropagation();
        });
        colorSelector.appendChild(swatch);
    });

    note.appendChild(header);
    note.appendChild(body);
    note.appendChild(colorSelector);

    document.body.appendChild(note);

    // Minimize
    minimizeBtn.addEventListener("click", () => {
        note.dataset.minimized = "true";
        note.style.display = "none";
        addDockTab(note);
        saveNotes();
    });

    // Delete
    deleteBtn.addEventListener("click", () => {
        note.remove();
        removeDockTab(note.dataset.id);
        saveNotes();
    });

    // Dragging
    let offsetX, offsetY;
    header.addEventListener("mousedown", e => {
        offsetX = e.clientX - note.offsetLeft;
        offsetY = e.clientY - note.offsetTop;

        function move(e) {
            note.style.left = (e.clientX - offsetX) + "px";
            note.style.top = (e.clientY - offsetY) + "px";
        }
        document.addEventListener("mousemove", move);
        document.addEventListener("mouseup", () => {
            document.removeEventListener("mousemove", move);
            saveNotes();
        }, { once: true });
    });

    if (!note.dataset.minimized || note.dataset.minimized === "false") {
        note.style.display = "block";
    } else {
        note.style.display = "none";
        addDockTab(note);
    }

    saveNotes();
}

// Dock tab
function addDockTab(note) {
    let tab = document.createElement("div");
    tab.className = "dock-tab";
    tab.dataset.id = note.dataset.id;
    tab.innerText = note.querySelector(".note-title").innerText;

    tab.addEventListener("click", () => {
        note.style.display = "block";
        note.dataset.minimized = "false";
        tab.remove();
        saveNotes();
    });

    dock.appendChild(tab);
}

function removeDockTab(id) {
    const tab = dock.querySelector(`.dock-tab[data-id="${id}"]`);
    if (tab) tab.remove();
}

// Add button
addBtn.addEventListener("click", () => createNote());

// Load saved notes
notes.forEach(n => createNote(n));

// Quill cursor follow
const quillCursor = document.getElementById("quill-cursor");

document.addEventListener("mousemove", (e) => {
    quillCursor.style.transform =
        `translate(${e.clientX}px, ${e.clientY}px) translate(-8px, -35px)`;
})

document.addEventListener("mousedown", () => {
    quillCursor.style.transform += " scale(0.95)";
});
document.addEventListener("mouseup", () => {
    quillCursor.style.transform = quillCursor.style.transform.replace(" scale(0.95)", "");
});
</script>

</body>
</html>
