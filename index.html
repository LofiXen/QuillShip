<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QuillShip</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=Inter&display=swap" rel="stylesheet">

<style>
/* ======================
   Body & Global Styles
   ====================== */
body, input, textarea, button, a {
    cursor: none !important;
}

body {
    margin: 0;
    background: #f2e9dc;
    font-family: 'Cormorant Garamond', serif;
    overflow-x: hidden;
}

/* ======================
   Notebook Layout
   ====================== */
.frame {
    position: relative;
    width: 740px;
    margin: 60px auto;
}

.notebook-with-sidebar {
    display: flex;
    max-width: 1000px;
    margin: 40px auto;
    position: relative;
}

.notebook {
    width: 700px;
    margin: 0 auto;
    padding: 0;
    background: transparent;
    box-sizing: border-box;
    position: relative;
    z-index: 1;
}

/* ======================
   Titles
   ====================== */
.title {
    font-size: 32px;
    color: #5a4330;
    margin: 0 40px 10px;
}

.subtitle {
    font-size: 13px;
    color: #9c8570;
    margin: 0 40px 25px;
    font-style: italic;
    letter-spacing: 0.5px;
}

.entry-title {
    width: calc(100% - 100px);
    margin: 0 50px 10px;
    font-size: 22px;
    border: none;
    background: transparent;
    font-family: 'Cormorant Garamond', serif;
    color: #3e2a1f;
    outline: none;
    border-bottom: 1px solid rgba(90,60,30,0.3);
}

.entry-title::placeholder {
    color: rgba(70,50,30,0.4);
    font-style: italic;
}

/* ======================
   Writing Area
   ====================== */
.entry {
    position: relative;
    z-index: 1;
    width: 100%;
    min-height: 300px;
    border: none;
    resize: none;
    font-size: 18px;
    background: url('https://i.imgur.com/vKA1DiL.png') repeat-y;
    background-size: 100% auto;
    background-position: top center;
    color: #2a1408;
    text-shadow:
        0.3px 0.3px 0 #1a0d05,
        0.5px 0.5px 0 rgba(0,0,0,0.2);
    font-family: 'Cormorant Garamond', serif;
    line-height: 1.6;
    padding: 60px 50px;
    box-sizing: border-box;
    outline: none;
    overflow: hidden;
}

.entry::placeholder {
    color: rgba(70, 50, 30, 0.45);
    font-style: italic;
}

/* Parchment tint & grain */
.entry::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(90, 60, 30, 0.12);
    pointer-events: none;
    z-index: -1;
}
.entry::after {
    content: "";
    position: absolute;
    inset: 0;
    background: url('https://i.imgur.com/8Qf6YQK.png');
    opacity: 0.08;
    pointer-events: none;
    mix-blend-mode: multiply;
    z-index: -1;
}

/* ======================
   Sidebar
   ====================== */
.sidebar {
    width: 200px;
    min-width: 200px;
    background: #f2e9dc;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-right: 2px solid #d1bfa3;
    overflow-y: auto;
    position: relative;
    z-index: 2;
}

#add-note {
    background: #2f4f3f; /* forest green */
    border: none;
    padding: 6px 10px;
    cursor: pointer;
    color: #f2e9dc;
    font-family: 'Cormorant Garamond', serif;
}

.entry-item {
    background: #e6d6bd;
    border: none;
    padding: 6px;
    cursor: pointer;
    text-align: left;
    font-family: 'Cormorant Garamond', serif;
}
.entry-item:hover {
    background: #d1bfa3;
}

/* ======================
   Sticky Notes
   ====================== */
.sticky-note {
    position: absolute;
    min-width: 150px;
    min-height: 100px;
    max-width: 300px;
    resize: both;
    overflow: auto;
    z-index: 10;
    background: #f0d8c0;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    border-radius: 6px;
    font-family: 'Cormorant Garamond', serif;
}

.note-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(200,150,100,0.8);
    padding: 2px 6px;
    cursor: move;
    font-size: 12px;
    font-weight: bold;
}

.note-title {
    flex: 1;
    margin-right: 6px;
    outline: none;
}

.note-body {
    padding: 6px;
    min-height: 60px;
    outline: none;
    color: rgba(0,0,0,0.45);
}

.delete-note, .minimize-note {
    background: none;
    border: none;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
}

.sticky-colors {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 4px;
}

.color-option {
    width: 20px;
    height: 20px;
    border-radius: 3px;
    cursor: pointer;
    border: 1px solid #555;
}

.sticky-dock {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 40px;
    background: rgba(200,180,150,0.9);
    display: flex;
    gap: 4px;
    padding: 2px;
    overflow-x: auto;
    z-index: 5000;
}

.dock-tab {
    background: #d1bfa3;
    padding: 2px 6px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
}

/* Music button */
#music-toggle {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 5000;
    background: #d1bfa3;
    border: none;
    padding: 6px 10px;
    font-family: 'Cormorant Garamond', serif;
    cursor: inherit;
}

/* Quill cursor */
#quill-cursor {
    position: fixed;
    width: 60px;
    height: 60px;
    pointer-events: none;
    z-index: 9999;
}
</style>
</head>

<body>

<img src="QuillCursor-fotor-bg-remover-20260329143216.png" id="quill-cursor">

<!-- MUSIC -->
<audio id="ship-music" loop>
    <source src="coulou's cafe trumpet meditations (no. 41).mp3" type="audio/mpeg">
</audio>
<button id="music-toggle">🔊</button>

<div class="notebook-with-sidebar">
    <div class="sidebar">
        <button id="add-note">+ Add Note</button>
    </div>

    <div class="main-notebook">
        <div class="frame">
            <div class="notebook">
                <div class="title">QuillShip</div>
                <div class="subtitle">Flick your quill and calm your mind.</div>

                <!-- NEW TITLE INPUT -->
                <input class="entry-title" placeholder="Untitled Page..." />

                <!-- TEXTAREA -->
                <textarea class="entry" placeholder="The ink won’t write itself..."></textarea>
            </div>
        </div>
    </div>
</div>

<div class="sticky-dock"></div>

<script>
// ======================
// Journal System
// ======================
const titleInput = document.querySelector(".entry-title");
const entry = document.querySelector(".entry");
const sidebar = document.querySelector(".sidebar");

// Store entries
let entries = JSON.parse(localStorage.getItem("entries")) || {};
let currentEntryId = null;

// CREATE NEW ENTRY
function createEntry(title = "Untitled Page") {
    const id = "entry_" + Date.now();
    entries[id] = { title, content: "" };
    saveEntries();
    renderEntryList();
    loadEntry(id);
}

// SAVE
function saveEntries() {
    localStorage.setItem("entries", JSON.stringify(entries));
}

// LOAD
function loadEntry(id) {
    currentEntryId = id;
    entry.value = entries[id].content || "";
    titleInput.value = entries[id].title || "";
    resizeEditor();
}

// RESIZE
function resizeEditor() {
    entry.style.height = "auto";
    entry.style.height = entry.scrollHeight + "px";
}

// DEBOUNCED SAVE
let saveTimeout;
entry.addEventListener("input", () => {
    resizeEditor();
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
        if (currentEntryId) {
            entries[currentEntryId].content = entry.value;
            entries[currentEntryId].title = titleInput.value;
            saveEntries();
            renderEntryList();
        }
    }, 400);
});

titleInput.addEventListener("input", () => {
    if (currentEntryId) {
        entries[currentEntryId].title = titleInput.value;
        saveEntries();
        renderEntryList();
    }
});

// RENDER SIDEBAR
function renderEntryList() {
    const oldEntries = sidebar.querySelectorAll(".entry-item");
    oldEntries.forEach(e => e.remove());

    Object.keys(entries).forEach(id => {
        const btn = document.createElement("button");
        btn.className = "entry-item";
        btn.textContent = entries[id].title || "Untitled Page";
        btn.addEventListener("click", () => loadEntry(id));
        sidebar.appendChild(btn);
    });
}

// INITIALIZE
if (Object.keys(entries).length === 0) createEntry("First Entry");
else {
    renderEntryList();
    loadEntry(Object.keys(entries)[0]);
}

// NEW PAGE BUTTON
const newEntryBtn = document.createElement("button");
newEntryBtn.textContent = "+ New Page";
newEntryBtn.style.background = "#2f4f3f"; // forest green
newEntryBtn.style.color = "#f2e9dc";
newEntryBtn.style.border = "none";
newEntryBtn.style.padding = "6px";
newEntryBtn.style.marginTop = "10px";
newEntryBtn.style.cursor = "pointer";
sidebar.insertBefore(newEntryBtn, sidebar.children[0]);
newEntryBtn.addEventListener("click", () => createEntry());

// ======================
// Music system
// ======================
const music = document.getElementById("ship-music");
const toggleBtn = document.getElementById("music-toggle");
let hasStarted = false;
function fadeIn(audio) {
    let vol = 0; audio.volume = 0; audio.muted = false;
    const interval = setInterval(() => {
        if (vol < 0.3) { vol += 0.01; audio.volume = vol; } 
        else clearInterval(interval);
    }, 200);
}
document.addEventListener("click", () => { if (!hasStarted) { music.play(); fadeIn(music); hasStarted = true; } });
toggleBtn.addEventListener("click", () => {
    if (music.paused) { music.play(); toggleBtn.textContent = "🔊"; } 
    else { music.pause(); toggleBtn.textContent = "🔇"; }
});

// ======================
// Sticky Notes System
// ======================
// [existing code unchanged]
</script>

</body>
</html>
