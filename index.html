<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QuillShip</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=Inter&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #f2e9dc;
    font-family: 'Cormorant Garamond', serif;
}

/* Notebook */
.notebook {
    width: 700px;
    margin: 60px auto;
    padding: 40px;
    background: #fffaf3;
    box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    border-radius: 14px;
    border: 20px solid transparent;
    border-image: url('https://i.imgur.com/I8Vytz8.jpeg') 30 round;
    box-sizing: border-box;
}

/* Title */
.title {
    font-size: 32px;
    color: #5a4330;
    margin-bottom: 10px;
}

/* Subtitle */
.subtitle {
    font-size: 13px;
    color: #9c8570;
    margin-bottom: 25px;
    font-style: italic;
    letter-spacing: 0.5px;
}

/* Writing area */
.entry {
    width: 100%;
    min-height: 300px;
    border: none;
    resize: none;
    font-size: 18px;
    
    /* Use your parchment image */
    color: #382514;
    background: url('https://i.imgur.com/I8Vytz8.jpeg') no-repeat;
    background-size: cover;
    background-position: top center;
    color: #1e0f00;
    text-shadow: 0 0 1px #000000;
}
	.entry::before {
    	content: "";
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(255, 255, 255, 0.3); /* semi-transparent overlay */
        pointer-events: none;
}

.entry {
    outline: none;
    font-family: 'Cormorant Garamond', serif;
    line-height: 1.6;
    padding: 40px;
    box-sizing: border-box;
    overflow: hidden;
}
</style>
</head>

<body>

<div class="notebook">
    <div class="title">QuillShip</div>
    <div class="subtitle">Flick your quill and calm your mind.</div>

    <textarea class="entry" placeholder="The ink won’t write itself..."></textarea>
</div>

<script>
const entry = document.querySelector(".entry");

// Load saved text and set height
entry.value = localStorage.getItem("journalEntry") || "";
entry.style.height = entry.scrollHeight + 'px';

// Save as you type and auto-resize
entry.addEventListener("input", () => {
    entry.style.height = 'auto';
    entry.style.height = entry.scrollHeight + 'px';
    localStorage.setItem("journalEntry", entry.value);
});
</script>

</body>
</html>
