<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QuillShip</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=Inter&display=swap" rel="stylesheet">

<style>
/* Body and fonts */
body {
    margin: 0;
    background: #f2e9dc;
    font-family: 'Cormorant Garamond', serif;
    overflow-x: hidden;
}

/* Frame containing notebook */
.frame {
    position: relative;
    width: 740px;
    margin: 60px auto;
}

/* Notebook */
.notebook {
    width: 700px;
    margin: 0 auto;
    padding: 0;
    background: transparent;
    box-sizing: border-box;
    position: relative;
    z-index: 1;
}

/* Titles */
.title {
    font-size: 32px;
    color: #5a4330;
    margin: 0 40px 10px;
}
.subtitle {
    font-size: 13px;
    color: #9c8570;
    margin: 0 40px 25px;
    font-style: italic;
    letter-spacing: 0.5px;
}

/* Writing area */
.entry {
    position: relative;
    z-index: 1;
    width: 100%;
    min-height: 300px;
    border: none;
    resize: none;
    font-size: 18px;
    background: url('https://i.imgur.com/vKA1DiL.png') repeat-y;
    background-size: 100% auto;
    background-position: top center;
    color: #2a1408;
    text-shadow:
        0.3px 0.3px 0 #1a0d05,
        0.5px 0.5px 0 rgba(0,0,0,0.2);
    font-family: 'Cormorant Garamond', serif;
    line-height: 1.6;
    padding: 60px 50px;
    box-sizing: border-box;
    outline: none;
    overflow: hidden;
}

/* Placeholder styling */
.entry::placeholder {
    color: rgba(70, 50, 30, 0.45);
    font-style: italic;
}

/* Parchment tint and grain */
.entry::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(90, 60, 30, 0.12);
    pointer-events: none;
    z-index: -1;
}
.entry::after {
    content: "";
    position: absolute;
    inset: 0;
    background: url('https://i.imgur.com/8Qf6YQK.png');
    opacity: 0.08;
    pointer-events: none;
    mix-blend-mode: multiply;
    z-index: -1;
}

/* Layout */
.notebook-with-sidebar {
    display: flex;
    max-width: 1000px;
    margin: 40px auto;
    position: relative;
}

/* Sidebar */
.sidebar {
    width: 200px;
    min-width: 200px;
    background: #f2e9dc;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-right: 2px solid #d1bfa3;
    overflow-y: auto;
    position: relative;
    z-index: 2;
}

#add-note {
    background: #d1bfa3;
    border: none;
    padding: 6px 10px;
    cursor: pointer;
    font-family: 'Cormorant Garamond', serif;
}

/* Sticky notes */
.sticky-note {
    position: absolute;
    padding: 10px;
    min-width: 100px;
    min-height: 80px;
    font-family: 'Cormorant Garamond', serif;
    line-height: 1.4;
    resize: both;
    overflow: auto;
    cursor: grab;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    border-radius: 6px;
    z-index: 10;
}

/* Colors */
.sticky-colors {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 4px;
}
.color-option {
    width: 20px;
    height: 20px;
    border-radius: 3px;
    cursor: pointer;
    border: 1px solid #555;
}

.color-1 { background:#c8a16d; }
.color-2 { background:#e2cba9; }
.color-3 { background:#b5c99a; }
.color-4 { background:#a36e4c; }
.color-5 { background:#f0d8c0; }
.color-6 { background:#d9b48f; }
.color-7 { background:#8c6b4f; }
.color-8 { background:#d0a67b; }
.color-9 { background:#9a7d63; }
.color-10 { background:#c0b283; }
.color-11 { background:#b8a17a; }
.color-12 { background:#726255; }
.color-13 { background:#6e584f; }
.color-14 { background:#b3a18a; }
.color-15 { background:#d2c1a3; }

/* Music button */
#music-toggle {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 5000;
    background: #d1bfa3;
    border: none;
    padding: 6px 10px;
    font-family: 'Cormorant Garamond', serif;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- MUSIC -->
<audio id="ship-music" loop autoplay muted>
    <source src="docks.mp3" type="audio/mpeg">
</audio>
<button id="music-toggle">🔊</button>

<div class="notebook-with-sidebar">
    <div class="sidebar">
        <button id="add-note">+ Add Note</button>
    </div>

    <div class="main-notebook">
        <div class="frame">
            <div class="notebook">
                <div class="title">QuillShip</div>
                <div class="subtitle">Flick your quill and calm your mind.</div>
                <textarea class="entry" placeholder="The ink won’t write itself..."></textarea>
            </div>
        </div>
    </div>
</div>

<script>
// Journal save
const entry = document.querySelector(".entry");
entry.value = localStorage.getItem("journalEntry") || "";
entry.style.height = entry.scrollHeight + 'px';
entry.addEventListener("input", () => {
    entry.style.height = 'auto';
    entry.style.height = entry.scrollHeight + 'px';
    localStorage.setItem("journalEntry", entry.value);
});

// MUSIC (fade-in system)
const music = document.getElementById("ship-music");
const toggleBtn = document.getElementById("music-toggle");

function fadeIn(audio) {
    let vol = 0;
    audio.volume = 0;
    audio.muted = false;

    const interval = setInterval(() => {
        if (vol < 0.3) {
            vol += 0.01;
            audio.volume = vol;
        } else {
            clearInterval(interval);
        }
    }, 200);
}

window.addEventListener("load", () => {
    setTimeout(() => fadeIn(music), 800);
});

toggleBtn.addEventListener("click", () => {
    if (music.paused) {
        music.play();
        toggleBtn.textContent = "🔊";
    } else {
        music.pause();
        toggleBtn.textContent = "🔇";
    }
});

// Sticky notes (unchanged logic)
const addBtn = document.getElementById("add-note");

addBtn.addEventListener("click", () => {
    const note = document.createElement("div");
    note.contentEditable = "true";
    note.className = "sticky-note color-1";
    note.innerText = "New Note...";
    note.style.top = "50px";
    note.style.left = "220px";

    note.addEventListener("mousedown", dragMouseDown);

    const colorSelector = document.createElement("div");
    colorSelector.className = "sticky-colors";

    const colors = [
        'color-1','color-2','color-3','color-4','color-5',
        'color-6','color-7','color-8','color-9','color-10',
        'color-11','color-12','color-13','color-14','color-15'
    ];

    colors.forEach(color => {
        const c = document.createElement("div");
        c.className = `color-option ${color}`;
        c.addEventListener("click", (e) => {
            note.className = "sticky-note " + color;
            colorSelector.style.display = "none";
            e.stopPropagation();
        });
        colorSelector.appendChild(c);
    });

    note.appendChild(colorSelector);
    document.body.appendChild(note);
});

function dragMouseDown(e) {
    e.preventDefault();
    const note = e.target.closest(".sticky-note");

    let pos3 = e.clientX, pos4 = e.clientY;

    document.onmousemove = (e) => {
        let pos1 = pos3 - e.clientX;
        let pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;

        note.style.top = (note.offsetTop - pos2) + "px";
        note.style.left = (note.offsetLeft - pos1) + "px";
    };

    document.onmouseup = () => {
        document.onmousemove = null;
    };
}
</script>

</body>
</html>
