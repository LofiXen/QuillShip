<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuillShip</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=Inter&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <!-- Link to external CSS -->
</head>

<body>

    <div id="burn-modal" class="burn-hidden">
        <div class="burn-box">
            <div id="burn-text" class="burn-text"></div>
            <div class="burn-actions">
                <button id="burn-confirm">Burn</button>
                <button id="burn-cancel">Keep</button>
            </div>
        </div>
    </div>

    <img src="QuillCursor-fotor-bg-remover-20260329143216.png" id="quill-cursor">

    <!-- MUSIC -->
    <audio id="ship-music" loop>
        <source src="coulou's cafe trumpet meditations (no. 41).mp3" type="audio/mpeg">
    </audio>
    <button id="music-toggle">🔊</button>

    <div class="notebook-with-sidebar">
    <div class="sidebar">
        <button id="add-note">+ Add Note</button>
        <button id="add-chapter">+ New Chapter</button>
        <div id="chapters"></div>

        <!-- EXPORT / IMPORT (NOW INSIDE SIDEBAR) -->
        <div class="export-import">
<button onclick="exportData('txt')">Export TXT</button>
<button onclick="exportData('doc')">Export DOC</button>
<button onclick="exportData('json')">Export JSON</button>
<button onclick="exportData('pdf')">Export PDF</button>

<input type="file" id="importFile" style="display:none" onchange="importData(this.files[0])">
<button onclick="document.getElementById('importFile').click()">Import</button>
        </div>
    </div>

    <div class="main-notebook">
        <div class="frame">
            <div class="notebook">
    <div class="title">QuillShip</div>
    <div class="subtitle">Flick your quill and calm your mind.</div>
    <div class="editor-wrapper">
    	
        <div class="editor-toolbar">
            <button type="button" data-command="bold" title="Bold">
                <strong>B</strong>
            </button>
            <button type="button" data-command="italic" title="Italic">
                <em>I</em>
            </button>
            <button type="button" data-command="underline" title="Underline">
                <u>U</u>
            </button>
            <span class="toolbar-divider"></span>
            <button type="button" data-command="formatBlock" data-value="h1">
                H1
            </button>
            <button type="button" data-command="formatBlock" data-value="h2">
                H2
            </button>
            <button type="button" data-command="formatBlock" data-value="h3">
                H3
            </button>
            <button type="button" data-command="formatBlock" data-value="p">
                ¶
            </button>
            <span class="toolbar-divider"></span>
            <button type="button" data-command="insertUnorderedList">
                •
            </button>
            <button type="button" data-command="insertOrderedList">
                1.
            </button>
            <button type="button" data-command="formatBlock" data-value="blockquote">
                ❝
            </button>
            <span class="toolbar-divider"></span>
            <button type="button" data-command="undo">
                ↶
            </button>
            <button type="button" data-command="redo">
                ↷
            </button>
            <button type="button" id="insert-rule">
                ─
            </button>
        </div>
        <div
            class="entry"
            contenteditable="true"
            data-placeholder="The ink won’t write itself..."
            spellcheck="true"
        ></div>
    </div>
    <!-- =========================
         RIGHT-CLICK MENU
         ========================= -->

    <div id="editor-context-menu"
         class="editor-context-menu">

        <button type="button"
                data-context-command="bold">
            <strong>Bold</strong>
            <span>Ctrl+B</span>
        </button>

        <button type="button"
                data-context-command="italic">
            <em>Italic</em>
            <span>Ctrl+I</span>
        </button>

        <button type="button"
                data-context-command="underline">
            <u>Underline</u>
            <span>Ctrl+U</span>
        </button>


        <div class="context-divider"></div>


        <button type="button"
                data-context-command="formatBlock"
                data-value="h1">
            Heading 1
        </button>

        <button type="button"
                data-context-command="formatBlock"
                data-value="h2">
            Heading 2
        </button>

        <button type="button"
                data-context-command="formatBlock"
                data-value="h3">
            Heading 3
        </button>

        <button type="button"
                data-context-command="formatBlock"
                data-value="p">
            Normal Text
        </button>


        <div class="context-divider"></div>


        <button type="button"
                data-context-command="insertUnorderedList">
            • Bullet List
        </button>

        <button type="button"
                data-context-command="insertOrderedList">
            1. Numbered List
        </button>

        <button type="button"
                data-context-command="formatBlock"
                data-value="blockquote">
            ❝ Block Quote
        </button>


        <div class="context-divider"></div>


        <button type="button"
                data-context-command="insertHorizontalRule">
            — Scene Break
        </button>

        <button type="button"
                data-context-command="removeFormat">
            Clear Formatting
        </button>

    </div>

</div>
</div>
        </div>
    </div>
</div>
    <!-- Sticky Dock -->
    <div class="sticky-dock"></div>

    <script src="script.js"></script> <!-- Link to external JS -->
    
</body>
</html>
