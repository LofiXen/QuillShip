<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QuillShip</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=Inter&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #f2e9dc;
    font-family: 'Cormorant Garamond', serif;
}

/* Notebook */
.notebook {
    width: 700px;
    margin: 60px auto;
    padding: 40px;
    background: #fffaf3;
    box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    border-radius: 14px;
}

/* Title */
.title {
    font-size: 32px;
    color: #5a4330;
    margin-bottom: 10px;
}

/* Subtitle */
.subtitle {
    font-size: 14px;
    color: #8a6f58;
    margin-bottom: 25px;
}

/* Writing area */
.entry {
    width: 100%;
    height: 300px;
    border: none;
    resize: none;
    font-size: 18px;
    background: transparent;
    outline: none;
    color: #3e2f22;
}
</style>
</head>

<body>

<div class="notebook">
    <div class="title">QuillShip</div>
    <div class="subtitle">Flick your quill and calm your mind.</div>

    <textarea class="entry" placeholder="The ink won't write itself..."></textarea>
</div>

</body>
</html>
